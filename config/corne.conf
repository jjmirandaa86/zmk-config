# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000   # 3 min

# LEDs enable
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Si tienes per-key RGB (no todos los Corne lo tienen)
#CONFIG_ZMK_RGB_BACKLIGHT=y
#CONFIG_ZMK_RGB_BACKLIGHT_AUTO_OFF_IDLE=y

# Limitar consumo
#CONFIG_ZMK_RGB_UNDERGLOW_BRIGHTNESS=10
#CONFIG_ZMK_RGB_BACKLIGHT_BRIGHTNESS=10

# Reducir efectos (MUY importante)
#CONFIG_ZMK_RGB_UNDERGLOW_EFFECT_STATIC=y
#CONFIG_ZMK_RGB_UNDERGLOW_EFFECT_BREATH=n
#CONFIG_ZMK_RGB_UNDERGLOW_EFFECT_RAINBOW=n
#CONFIG_ZMK_RGB_UNDERGLOW_EFFECT_SWIRL=n
